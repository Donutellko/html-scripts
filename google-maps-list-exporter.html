<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps List Exporter</title>
  <style>
    :root {
      --bg: #111318;
      --surface: #1c1f26;
      --surface2: #22262f;
      --border: #2e3340;
      --text: #e4e6ec;
      --muted: #7a7f8e;
      --accent: #5c7cfa;
      --accent-hover: #748ffc;
      --success: #2f9e44;
      --error: #fa5252;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      padding: 20px;
      min-height: 100vh;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .section {
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    input[type="text"], textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input[type="text"] { width: 100%; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }

    textarea {
      width: 100%;
      resize: vertical;
      line-height: 1.5;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ghost.copied { background: var(--success); color: #fff; border-color: transparent; }

    .info-box {
      margin-top: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
    }

    .info-box code {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      word-break: break-all;
    }

    .info-box .api-url {
      display: block;
      margin: 8px 0;
      font-family: "SF Mono", monospace;
      font-size: 11px;
      color: var(--accent);
      word-break: break-all;
    }

    .steps {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .step-num {
      background: var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step code { font-size: 11px; }

    .error { color: var(--error); font-size: 13px; margin-top: 8px; }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .output-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .pane-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .pane-label span {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .output-area {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      padding: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.7;
      min-height: 220px;
    }

    .list-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .list-meta strong { color: var(--text); }

    .hidden { display: none; }

    .html-preview-wrap {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 12px;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.7;
      user-select: text;
    }

    .html-preview-wrap h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111;
    }

    .html-preview-wrap ul {
      padding-left: 20px;
    }

    .html-preview-wrap li {
      margin-bottom: 4px;
    }

    .html-preview-wrap a {
      color: #1a73e8;
      text-decoration: none;
    }

    .html-preview-wrap a:hover { text-decoration: underline; }

    .html-preview-wrap .place-note {
      color: #555;
      font-size: 13px;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .output-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>Option 1 — List URL</h2>
    <div class="row">
      <input type="text" id="listUrl"
        placeholder="https://www.google.com/maps/@/data=… or https://maps.app.goo.gl/…">
      <button class="btn-primary" onclick="processUrl()">Get API URL</button>
    </div>
    <div id="urlResult"></div>
  </div>

  <hr class="divider">

  <div class="section">
    <h2>Option 2 — Paste JSON</h2>
    <div class="info-box" style="margin-bottom: 10px;">
      <div class="steps">
        <div class="step"><div class="step-num">1</div><span>Open your list in Google Maps</span></div>
        <div class="step"><div class="step-num">2</div><span>Open DevTools → Network tab <code>(F12)</code></span></div>
        <div class="step"><div class="step-num">3</div><span>Filter requests by <code>getlist</code></span></div>
        <div class="step"><div class="step-num">4</div><span>Reload the page — click the <code>getlist</code> request → <strong>Response</strong> → select all &amp; copy</span></div>
        <div class="step"><div class="step-num">5</div><span>Paste below and click Parse</span></div>
      </div>
    </div>
    <textarea id="jsonInput" rows="5" placeholder='[[["EfHS60Uq13Yp5llFa7x4yQ",1,null,…'></textarea>
    <div class="row" style="margin-top: 8px;">
      <button class="btn-primary" onclick="parseAndRender()">Parse</button>
    </div>
    <div class="error hidden" id="parseError"></div>
  </div>

  <hr class="divider">

  <div id="outputSection" class="hidden">
    <div class="list-meta" id="listMeta"></div>

    <div class="pane-label" style="margin-bottom: 8px;">
      <span>Formatted</span>
      <button class="btn-ghost" id="copyHtml" onclick="copyFormatted()">Copy with formatting</button>
    </div>
    <div class="html-preview-wrap" id="htmlPreview"></div>

    <div class="output-grid" style="margin-top: 12px;">
      <div>
        <div class="pane-label">
          <span>Markdown</span>
          <button class="btn-ghost" id="copyMd" onclick="copyOutput('markdownOut', 'copyMd')">Copy</button>
        </div>
        <textarea class="output-area" id="markdownOut" readonly></textarea>
      </div>
      <div>
        <div class="pane-label">
          <span>JSON</span>
          <button class="btn-ghost" id="copyJson" onclick="copyOutput('jsonOut', 'copyJson')">Copy</button>
        </div>
        <textarea class="output-area" id="jsonOut" readonly></textarea>
      </div>
    </div>
  </div>

  <script>
    function extractListId(url) {
      const m = url.match(/!2s([A-Za-z0-9_\-]{15,})(?=!)/);
      return m ? m[1] : null;
    }

    function buildApiUrl(listId) {
      return `https://www.google.com/maps/preview/entitylist/getlist?authuser=0&hl=en&gl=es&pb=!1m4!1s${listId}!2e1!3m1!1e1!2e2!3e3!4i500`;
    }

    function processUrl() {
      const url = document.getElementById('listUrl').value.trim();
      const result = document.getElementById('urlResult');

      if (url.includes('maps.app.goo.gl')) {
        result.innerHTML = `<div class="info-box">
          <strong>Short URL detected.</strong> Open it in your browser first — it will redirect to the full Google Maps URL. Then copy that URL from the address bar and paste it above.
        </div>`;
        return;
      }

      const listId = extractListId(url);
      if (!listId) {
        result.innerHTML = `<div class="error">Could not find a list ID in this URL. Make sure it's a Google Maps saved list URL (not a directions URL).</div>`;
        return;
      }

      const apiUrl = buildApiUrl(listId);
      result.innerHTML = `<div class="info-box">
        <strong>List ID:</strong> <code>${listId}</code>
        <span class="api-url">${apiUrl}</span>
        <div class="row" style="gap:8px;margin-top:6px">
          <button class="btn-ghost" onclick="window.open('${apiUrl}','_blank')">Open in new tab ↗</button>
          <button class="btn-ghost" onclick="tryFetch('${apiUrl}')">Try auto-fetch</button>
        </div>
        <div class="steps" style="margin-top:10px">
          <div class="step"><div class="step-num">→</div><span>Opening the URL downloads the data. Or use auto-fetch if you're logged into Google in this browser.</span></div>
          <div class="step"><div class="step-num">→</div><span>Paste the downloaded file contents into Option 2 below.</span></div>
        </div>
      </div>`;
    }

    async function tryFetch(apiUrl) {
      try {
        const resp = await fetch(apiUrl, { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        document.getElementById('jsonInput').value = text;
        parseAndRender();
      } catch (e) {
        const result = document.getElementById('urlResult');
        result.innerHTML += `<div class="error" style="margin-top:6px">Auto-fetch failed (CORS): open the URL in a new tab, copy the content, and paste into Option 2.</div>`;
      }
    }

    function parseRaw(text) {
      return JSON.parse(text.replace(/^\)\]\}'\s*/, '').trim());
    }

    function extractPlaces(data) {
      const list = data[0];
      const listName = list[4] || 'My List';
      const places = (list[8] || [])
        .map(p => {
          const lat = p[1]?.[5]?.[2] ?? null;
          const lng = p[1]?.[5]?.[3] ?? null;
          const name = p[2] || '';
          return {
            name,
            note: p[3] || '',
            address: p[1]?.[4] || '',
            lat,
            lng,
            mapsUrl: lat != null
              ? `https://www.google.com/maps?q=${lat},${lng}`
              : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`,
          };
        })
        .filter(p => p.name);
      return { listName, places };
    }

    function toMarkdown({ listName, places }) {
      const lines = [`# ${listName}`, ''];
      for (const p of places) {
        let line = `- [${p.name}](${p.mapsUrl})`;
        if (p.address) line += ` — ${p.address}`;
        if (p.note) line += `\n  > ${p.note}`;
        lines.push(line);
      }
      return lines.join('\n');
    }

    function renderHtml({ listName, places }) {
      const items = places.map(p => {
        const addr = p.address ? ` <span style="color:#555">— ${p.address}</span>` : '';
        const note = p.note ? `<br><span class="place-note">${p.note}</span>` : '';
        return `<li><a href="${p.mapsUrl}" target="_blank">${p.name}</a>${addr}${note}</li>`;
      }).join('\n');
      return `<h3>${listName}</h3>\n<ul>\n${items}\n</ul>`;
    }

    function parseAndRender() {
      const text = document.getElementById('jsonInput').value.trim();
      const errEl = document.getElementById('parseError');
      errEl.classList.add('hidden');

      if (!text) {
        errEl.textContent = 'Paste JSON first.';
        errEl.classList.remove('hidden');
        return;
      }

      let data;
      try { data = parseRaw(text); }
      catch (e) {
        errEl.textContent = `JSON parse error: ${e.message}`;
        errEl.classList.remove('hidden');
        return;
      }

      let result;
      try { result = extractPlaces(data); }
      catch (e) {
        errEl.textContent = `Could not read list structure: ${e.message}`;
        errEl.classList.remove('hidden');
        return;
      }

      document.getElementById('listMeta').innerHTML =
        `<strong>${result.listName}</strong> &nbsp;·&nbsp; ${result.places.length} places`;
      document.getElementById('htmlPreview').innerHTML = renderHtml(result);
      document.getElementById('markdownOut').value = toMarkdown(result);
      document.getElementById('jsonOut').value = JSON.stringify(result, null, 2);
      document.getElementById('outputSection').classList.remove('hidden');
      document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
    }

    function copyOutput(textareaId, btnId) {
      const text = document.getElementById(textareaId).value;
      const btn = document.getElementById(btnId);
      const done = () => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(done).catch(() => { execCopy(text); done(); });
      } else { execCopy(text); done(); }
    }

    function copyFormatted() {
      const el = document.getElementById('htmlPreview');
      const btn = document.getElementById('copyHtml');
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy with formatting'; btn.classList.remove('copied'); }, 2000);
    }

    function execCopy(text) {
      const el = Object.assign(document.createElement('textarea'), {
        value: text,
        style: 'position:fixed;opacity:0;pointer-events:none'
      });
      document.body.appendChild(el);
      el.focus(); el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    document.getElementById('jsonInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) parseAndRender();
    });
    document.getElementById('listUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') processUrl();
    });
  </script>
</body>
</html>
